function genAlloc(){
  var maxhi=Math.max(1,Math.round(num(S.params.maxhi)||2)),rank=0,map=[],n=0;
  for(var i=0;i<S.buildings.length;i++){
    if(bhigh(S.buildings[i])&&bactive(S.buildings[i])){rank++;var g=Math.ceil(rank/maxhi);map[i]=g;if(g>n)n=g;}else map[i]=0;}
  if(n===0)n=S.buildings.length?1:0;
  for(var j=0;j<map.length;j++)if(map[j]===0)map[j]=1;
  var bg=Math.min(Math.max(1,Math.round(num(S.params.basegen)||1)),Math.max(1,n));
  return {n:n,map:map,basegen:bg};
}
function connFor(kwTot,parking){
  var kva=kwTot/(num(S.params.connpf)||0.92);
  var amps=kva*(num(S.params.amp)||1.44)+(parking||0)*(num(S.params.park)||0.9);
  var pick=(amps>0)?up(CONN,amps):null;
  return {kw:kwTot,kva:kva,amps:amps,pick:pick,hv:(pick===null&&amps>0)};
}
function compute(){
  var a=genAlloc(),gpf=num(S.params.genpf)||0.8,gens=[],g,i;
  var common=commonItems();
  for(g=1;g<=a.n;g++){
    var fed=[],names=[],fire=0,norm=0,elevNote=[];
    for(i=0;i<S.buildings.length;i++){
      if(a.map[i]!==g)continue;
      var b=S.buildings[i],nm=bname(b,i),items=bldItems(b,nm);
      names.push(nm);
      var maxE=0,maxEn="";
      items.forEach(function(it){
        if(it.group===NE)return;
        fed.push(it);
        norm+=tot(it);
        if(it.elev){if(it.unit>maxE){maxE=it.unit;maxEn=it.name;}}
        else if(it.fire)fire+=tot(it)*it.ff;
      });
      if(maxE>0){fire+=maxE;elevNote.push(nm+": "+maxEn+" · "+fmt(maxE,1)+" kW");}
    }
    if(a.basegen===g){
      names.push("מרתף משותף");
      common.forEach(function(it){if(it.group===NE)return;fed.push(it);norm+=tot(it);if(it.fire)fire+=tot(it)*it.ff;});
    }
    var fk=fire/gpf,nk=norm/gpf,req=Math.max(fk,nk);
    gens.push({g:g,names:names,items:fed,elevNote:elevNote,fireKW:fire,normKW:norm,
               fireKVA:fk,normKVA:nk,req:req,pick:(req>0?up(GENS,req):null),win:(fk>=nk?"fire":"norm")});
  }
  return {alloc:a,gens:gens,common:common};
}

function loadTable(items,opts){

  var t=0,f=0;
  items.forEach(function(it){
    if(opts.hideZero&&tot(it)===0)return;
    var fc=it.elev?0:(it.fire?tot(it)*it.ff:0);
    t+=tot(it);f+=fc;
    var none=(!it.elev&&it.qty===0), blank=(it.elev&&!it.unit);

      (blank?'<td colspan="3">לא הוזן הספק</td>':none?'<td colspan="3">'+ABSENT+'</td>':

        '<td>'+(it.elev?"—":(fc?fmt(fc,1):"—"))+'</td>':'')+'</tr>';
  });
  var span=(opts.showSrc?1:0)+5;
  rows+='<tr class="tot"><td colspan="'+span+'">'+(opts.totalLabel||"סה״כ")+'</td><td>'+fmt(t,1)+'</td>'+
        '<td></td>'+(opts.fireCol?'<td></td><td>'+fmt(f,1)+'</td>':'')+'</tr></tbody>';

function dupName(base){
  var names={};S.buildings.forEach(function(x){names[(x.name||"").trim()]=1;});
  var m=base.match(/^(.*?)(\s*)(\d+)$/), stem=base, n=2;
  if(m){stem=m[1];n=parseInt(m[3],10)+1;}
  var cand;
  for(var k=0;k<60;k++){
    cand=(m?(stem+" "+(n+k)):(base+" "+(n+k))).trim().slice(0,20);
    if(!names[cand])return cand;
  }
  return (base+" עותק").slice(0,20);
}

}

function decorate(){
  var list=document.querySelectorAll('#app input[type="text"],#app input[type="number"]');
  Array.prototype.forEach.call(list,function(inp){
    if(inp.readOnly||inp.dataset.nox)return;
    var par=inp.parentElement;
    if(par&&par.classList.contains("fld")){sync(par,inp);return;}
    var w=document.createElement("span");w.className="fld";
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    var b=document.createElement("button");b.type="button";b.className="clr";
    b.textContent="\u00d7";b.title="ניקוי השדה";b.setAttribute("aria-label","ניקוי השדה");
    w.appendChild(b);
    b.addEventListener("click",function(){
      inp.value="";inp.dispatchEvent(new Event("input",{bubbles:true}));
      sync(w,inp);inp.focus();});
    inp.addEventListener("input",function(){inp.dataset.touched="1";sync(w,inp);});
    inp.addEventListener("focus",function(){
      var v=String(inp.value||"").trim();
      if(v==="0"||v==="0.0"||v==="0.00"){inp.dataset.wasZero="1";inp.value="";sync(w,inp);}
      else if(inp.select)setTimeout(function(){try{inp.select();}catch(e){}},0);});
    inp.addEventListener("blur",function(){
      if(inp.dataset.wasZero==="1"&&String(inp.value||"").trim()===""){inp.value="0";}
      delete inp.dataset.wasZero;sync(w,inp);});
    sync(w,inp);
  });
  function sync(w,inp){w.classList.toggle("has",String(inp.value||"").length>0);}
}

function ask(title,body,okLabel,onYes){

  bx.innerHTML='<div class="mt">'+esc(title)+'</div><div class="mb">'+body+'</div>'+
    '<div class="ma"><button class="btn" data-a="no" type="button">ביטול</button>'+
    '<button class="btn danger" data-a="yes" type="button">'+esc(okLabel)+'</button></div>';

var DBH=null, SAVES=[];
function lsSaves(){try{return JSON.parse(localStorage.getItem("tiktin-gen-saves")||"[]");}catch(e){return [];}}
function lsWrite(a){try{localStorage.setItem("tiktin-gen-saves",JSON.stringify(a));}catch(e){}}
function fillSaves(){
  var sel=document.getElementById("saved-sel"),cur=sel.value;
  sel.innerHTML=SAVES.length?"":'<option value="">— אין טפסים שמורים —</option>';

function refreshSaves(){
  if(DBH){
    DBH.collection("projects").orderBy("savedAt","desc").limit(50).get().then(function(sn){
      SAVES=sn.docs.map(function(d){var v=d.data()||{};return {id:d.id,name:v.name,savedAt:v.savedAt,data:v.data};});
      fillSaves();},function(){SAVES=lsSaves();fillSaves();});
  }else{SAVES=lsSaves();fillSaves();}
}
function doSave(){
  var nm=(S.project.name||"").trim();
  if(!nm){toast("להזין שם פרויקט לפני השמירה");document.getElementById("projname").focus();return;}
  var ex=null;SAVES.forEach(function(s){if((s.name||"")===nm)ex=s;});
  var id=ex?ex.id:("p"+Date.now());
  var body={name:nm,savedAt:new Date().toISOString(),data:clone(S)};
  if(DBH){
    DBH.doc("projects/"+id).set(body).then(function(){toast(ex?"הטופס עודכן":"הטופס נשמר");refreshSaves();},
      function(){lsSave(id,body,ex);});
  }else lsSave(id,body,ex);
}
function lsSave(id,body,ex){
  var a=lsSaves(),found=false;
  a=a.map(function(s){if(s.id===id){found=true;return {id:id,name:body.name,savedAt:body.savedAt,data:body.data};}return s;});
  if(!found)a.unshift({id:id,name:body.name,savedAt:body.savedAt,data:body.data});
  lsWrite(a);SAVES=a;fillSaves();toast(ex?"הטופס עודכן (בדפדפן)":"הטופס נשמר (בדפדפן)");
}
function doLoad(){
  var id=document.getElementById("saved-sel").value;
  if(!id){toast("לבחור טופס לטעינה");return;}
  var rec=null;SAVES.forEach(function(s){if(s.id===id)rec=s;});
  if(rec&&rec.data){S=clone(rec.data);normalize();render();toast("נטען: "+(rec.name||""));return;}
  if(DBH)DBH.doc("projects/"+id).get().then(function(d){
    var v=d.exists?d.data():null;
    if(v&&v.data){S=clone(v.data);normalize();render();toast("נטען: "+(v.name||""));}
    else toast("הטופס לא נמצא");});
}
function doDelete(){
  var sel=document.getElementById("saved-sel"),id=sel.value;
  if(!id){toast("לבחור טופס למחיקה");return;}
  var rec=null;SAVES.forEach(function(s){if(s.id===id)rec=s;});
  ask("מחיקת טופס שמור","הטופס <b>"+esc((rec&&rec.name)||"")+"</b> יימחק לצמיתות.","מחיקה",function(){
    if(DBH)DBH.doc("projects/"+id).delete().then(refreshSaves,function(){});
    var a=lsSaves().filter(function(x){return x.id!==id;});lsWrite(a);
    SAVES=SAVES.filter(function(x){return x.id!==id;});fillSaves();toast("נמחק");});
}
function emptyState(){return blankState(S.params);}

  if(!S.params)S.params=clone(SEED.params);
  ["hp","genpf","connpf","amp","park","sprink","maxhi","basegen","smokew"].forEach(function(k){
    if(S.params[k]===undefined)S.params[k]=SEED.params[k];});

function browserSave(name,blob,okMsg){
  try{
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=name;a.style.display="none";
    document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(u);},1500);
    toast(okMsg||"הקובץ הורד");return true;
  }catch(e){return false;}
}
function saveFile(name,blob,okMsg){
  if(typeof claude!=="undefined"&&claude.use){
    claude.use("downloads").then(function(d){
      if(!d){browserSave(name,blob,okMsg);return;}
      d.save({filename:name,data:blob}).then(function(){toast(okMsg||"הקובץ נשמר");},
        function(err){
          if(err&&err.code==="declined"){toast("הייצוא בוטל");return;}
          browserSave(name,blob,okMsg);});
    },function(){browserSave(name,blob,okMsg);});
    return;
  }

function b64utf8(t){
  var b=new TextEncoder().encode(t),x="";
  for(var i=0;i<b.length;i++)x+=String.fromCharCode(b[i]);
  return btoa(x);
}
function mimeWord(t){return "=?UTF-8?B?"+b64utf8(t)+"?=";}
function chunk76(b){var o=[];for(var i=0;i<b.length;i+=76)o.push(b.slice(i,i+76));return o.join("\r\n");}
function blobB64(blob,cb){
  var r=new FileReader();
  r.onload=function(){cb(String(r.result).split(",")[1]||"");};
  r.onerror=function(){cb(null);};
  r.readAsDataURL(blob);
}
function buildEml(to,subj,body,fname,mime,b64){
  var bd="----tiktin"+Date.now();
  return "To: "+(to||"")+"\r\n"+
    "Subject: "+mimeWord(subj)+"\r\n"+
    "X-Unsent: 1\r\n"+
    "MIME-Version: 1.0\r\n"+
    'Content-Type: multipart/mixed; boundary="'+bd+'"\r\n\r\n'+
    "--"+bd+"\r\n"+
    'Content-Type: text/plain; charset="UTF-8"\r\n'+
    "Content-Transfer-Encoding: base64\r\n\r\n"+chunk76(b64utf8(body))+"\r\n\r\n"+
    "--"+bd+"\r\n"+
    'Content-Type: '+mime+'; name="'+mimeWord(fname)+'"\r\n'+
    "Content-Transfer-Encoding: base64\r\n"+
    'Content-Disposition: attachment; filename="'+mimeWord(fname)+'"\r\n\r\n'+
    chunk76(b64)+"\r\n\r\n--"+bd+"--\r\n";
}

function exportBasicXls(onFile){

    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");}
  function cell(v,style){return '<Cell'+(style?' ss:StyleID="'+style+'"':'')+'><Data ss:Type="String">'+xe(v)+'</Data></Cell>';}
  function row(vals,style){return '<Row>'+vals.map(function(v){return cell(v,style);}).join("")+'</Row>';}
  var rows=[];
  rows.push(row(["קביעת גודל חיבור וגודל גנרטורים"],"title"));

  R.gens.forEach(function(G){rows.push(row(["גנרטור "+G.g,G.pick?(G.pick+" kVA"):"—",G.req,G.names.join(" + "),genLocText(G.g)||"—"]));});
  rows.push(row(["חיבורי חברת חשמל"],"section"));
  rows.push(row(["חיבור","גודל להזמנה","זרם מחושב [A]","הערה"],"head"));
  S.buildings.forEach(function(b,i){
    var c=connFor(sumAll(bldItems(b,bname(b,i))),0);
    rows.push(row([bname(b,i),c.hv?"מתח גבוה":("3×"+c.pick+"A"),Math.round(c.amps),bclass(b)]));
  });
  var cb=connFor(sumAll(commonItems()),parkingTotal());
  rows.push(row(["מרתף משותף",cb.hv?"מתח גבוה":("3×"+cb.pick+"A"),Math.round(cb.amps),parkingTotal()+" חניות (כולל "+parkingDev()+" בפיתוח)"]));
  rows.push(row(["נתוני בניינים"],"section"));
  rows.push(row(["בניין","גובה בקומות","גובה במטרים","סיווג","מספר מעליות"],"head"));
  S.buildings.forEach(function(b,i){rows.push(row([bname(b,i),num(b.floors),num(b.height),bclass(b),b.elev.length]));});
  var xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Styles><Style ss:ID="Default"><Alignment ss:Horizontal="Right" ss:Vertical="Center"/></Style>'+
    '<Style ss:ID="title"><Font ss:Color="#FFFFFF" ss:Bold="1" ss:Size="14"/><Interior ss:Color="#0D6B9E" ss:Pattern="Solid"/></Style>'+
    '<Style ss:ID="section"><Font ss:Bold="1"/><Interior ss:Color="#E2EEF6" ss:Pattern="Solid"/></Style>'+
    '<Style ss:ID="head"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#0D6B9E" ss:Pattern="Solid"/></Style></Styles>'+

function exportXls(onFile){

  }
  function titleBlock(ws,title,span){
    ws.getRow(1).height=42;
    if(logoId!==null)ws.addImage(logoId,{tl:{col:span-2.9,row:0.15},ext:{width:111,height:48}});

    c2.font={name:"Arial",size:10,color:{argb:"FF4D5E6B"}};
    c2.alignment={horizontal:"right",vertical:"middle",indent:1};
    ws.getRow(2).height=20;
    ws.getRow(3).height=6;
  }
  function bandRow(ws,r,text,span,fill,size){
    ws.mergeCells(r,1,r,span);
    var c=ws.getCell(r,1);
    c.value=text;
    c.font={name:"Arial",size:size||11,bold:true,color:{argb:BRAND.ink}};
    c.fill={type:"pattern",pattern:"solid",fgColor:{argb:fill||BRAND.soft}};
    c.alignment={horizontal:"right",vertical:"middle",indent:1};
    c.border={top:{style:"medium",color:{argb:BRAND.accent}},bottom:{style:"thin",color:{argb:BRAND.line}}};
    ws.getRow(r).height=22;
    return r+1;
  }
  function headRow(ws,r,cols){
    cols.forEach(function(t,i){
      var c=ws.getCell(r,i+1);
      c.value=t;
      c.font={name:"Arial",size:10,bold:true,color:{argb:"FFFFFFFF"}};
      c.fill={type:"pattern",pattern:"solid",fgColor:{argb:BRAND.accent}};
      c.alignment={horizontal:"center",vertical:"middle",wrapText:true};
      c.border=box("thin");
    });
    ws.getRow(r).height=28;
    return r+1;
  }
  function box(w){
    var st={style:w||"thin",color:{argb:BRAND.line}};
    return {top:st,left:st,bottom:st,right:st};
  }
  function put(ws,r,vals,opt){
    opt=opt||{};
    vals.forEach(function(v,i){
      var c=ws.getCell(r,i+1);
      c.value=(v===undefined||v===null)?"":v;
      c.font={name:"Arial",size:10,bold:!!opt.bold};
      c.alignment={horizontal:(i===0||(opt.startCols||[]).indexOf(i)>=0)?"right":"center",
        vertical:"middle",wrapText:i===0,indent:i===0?1:0};
      c.border=box();
      if(opt.fill)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:opt.fill}};
      if(typeof v==="number")c.numFmt=(Math.abs(v-Math.round(v))<1e-9)?"#,##0":"#,##0.0";
    });
    ws.getRow(r).height=18;
    return r+1;
  }
  function itemRows(ws,r,items,withSrc){
    items.forEach(function(it){
      var cells=[];
      if(withSrc)cells.push(it.src);
      cells.push(it.name,it.loc);
      var missing=(!it.elev&&it.qty===0)||(it.elev&&!it.unit);
      if(!it.elev&&it.qty===0)cells.push(ABSENT,"","");
      else if(missing)cells.push("לא הוזן הספק","","");
      else cells.push(it.elev?1:it.qty,it.unit,tot(it));
      cells.push(it.group,
